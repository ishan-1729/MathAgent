name = "mathagent_formal"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MathagentFormal"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

# Persistent Lean server backend: the community REPL keeps Mathlib loaded across audits.
[[require]]
name = "repl"
git = "https://github.com/leanprover-community/repl"
rev = "v4.30.0"

[[lean_lib]]
name = "MathagentFormal"
