# Denylist of non-elementary final-proof methods. See agent/PLAN.md Section 2 and Section 5.
#
# - `prose_terms`        : phrases the Layer-1b scanner looks for in ledger prose. This is a SOFT
#                          ROUTER TO REVIEW, not a deterministic gate (a euphemism scan cannot be
#                          sound). Multi-word/specific to avoid false positives.
# - `allow_context_terms`: overloaded words that are fine in elementary contexts; the scanner does
#                          NOT flag these on their own.
# - `lean_denylist_decls`: Layer-4 (Lean) content-bearing declarations/namespaces that are
#                          dispositive on appearance in a proof-term dependency closure.
# - `lean_infrastructure_allowlist`: plumbing always permitted (so the closure audit does not
#                          over-reject — see PLAN.md Section 5 Layer 4).

prose_terms:
  - class group
  - class field theory
  - ideal class
  - fractional ideal
  - dedekind domain
  - ring of integers
  - algebraic number field
  - number field
  - elliptic curve
  - modular form
  - modularity theorem
  - mihailescu
  - catalan's conjecture
  - baker's theorem
  - linear forms in logarithms
  - unique factorization domain
  - gauss sum
  - l-function
  - cyclotomic field
  - algebraic geometry
  - galois cohomology
  - p-adic completion
  - newton polygon
  - hensel's lemma            # beyond first-order lifting; flag for review
  - étale
  - scheme-theoretic

allow_context_terms:
  - order            # order of an element
  - unit             # units / unit digit
  - norm             # norm in a bounding argument
  - valuation        # v_p
  - descent          # elementary descent
  - prime ideal      # only flagged via 'ideal class'/'fractional ideal'; bare usage tolerated

lean_denylist_decls:
  - Mathlib.NumberTheory.ClassNumber
  - Mathlib.RingTheory.ClassGroup
  - Mathlib.RingTheory.DedekindDomain
  - Mathlib.NumberTheory.NumberField
  - NumberField.RingOfIntegers
  - IsDedekindDomain
  - EllipticCurve
  - Mathlib.NumberTheory.EllipticCurve
  - Mathlib.NumberTheory.ModularForms
  - Mathlib.NumberTheory.Cyclotomic
  - Mathlib.NumberTheory.Catalan
  - Mathlib.AlgebraicGeometry
  # Imaginary-quadratic rings Z[√d] and the Gaussian integers Z[i]: dropping into a quadratic ring and
  # using its unique-factorization / Euclidean structure (coprime factors of a cube are cubes) is the
  # classic NON-elementary shortcut for Diophantine equations (e.g. x^2+1=y^3). The elementary toolkit
  # forces a proof over Z (descent/bounding/congruence). The prose scanner already flags "unique
  # factorization domain"; this gives Layer-4 the matching content decls so it does not wave it through.
  - GaussianInt
  - Zsqrtd
  - Mathlib.NumberTheory.Zsqrtd
  # Generic UFD/PID structure on a ring: the *same* shortcut as Z[i]/Z[√d] but reached without naming
  # the quadratic ring — drop into "a ring that happens to be a UFD/PID" and use that coprime-factors-
  # of-a-cube-are-cubes / Bézout structure. The elementary toolkit forces the argument over Z. Component
  # decls (live in Mathlib.RingTheory.UniqueFactorizationDomain / PrincipalIdealDomain). Bare Nat/Int
  # arithmetic (ring/omega/gcd/Prime/factorization) does NOT pull these in (probed live).
  - UniqueFactorizationMonoid
  - IsPrincipalIdealRing
  # Adjoining an algebraic number / forming a quotient by an irreducible: AdjoinRoot K[x]/(f) and
  # Algebra.adjoin build a NON-elementary extension ring to factor in. (Algebra.adjoin is dotted so it
  # matches only that construct, NOT bare `Algebra` plumbing.)
  - AdjoinRoot
  - Algebra.adjoin
  # Cyclotomic theory / roots of unity. NOTE: cyclotomic polynomials live in
  # Mathlib.RingTheory.Polynomial.Cyclotomic — NOT under the already-denylisted
  # Mathlib.NumberTheory.Cyclotomic — so `Polynomial.cyclotomic`/`IsPrimitiveRoot`/`rootsOfUnity` were a
  # live GAP. `Polynomial.cyclotomic` is dotted so it does NOT touch bare single-variable `Polynomial`.
  - Polynomial.cyclotomic
  - IsPrimitiveRoot
  - rootsOfUnity
  - RootsOfUnity
  # p-adic COMPLETIONS: the field ℚ_p (Padic) and ring ℤ_p (PadicInt) are the analytic/topological
  # completion machinery (Padic = topological completion; not first-order over Z). Denylist the
  # COMPLETIONS only — the integer/rational valuation functions padicValNat/padicValInt/padicValRat
  # (v_p = exponent in the factorization) are elementary and are NOT matched by the bare components
  # `Padic`/`PadicInt` (probed live: a padicValNat proof passes; ℤ_[p]/ℚ_[p] reject).
  - Padic
  - PadicInt
  # Multivariate polynomial rings: a commutative-algebra / algebraic-geometry construct an elementary
  # NT proof over Z/Nat never needs (single-variable `Polynomial` is left alone — only the Mv form).
  - MvPolynomial
  # R-DENY (live-audited 2026-06-28, warm LeanServer + Mathlib): six non-elementary constructions were
  # still ADMITTED (audit.passed=True). Each is a "drop into a richer ring / pass to a quotient or
  # field of fractions" shortcut the elementary toolkit (descent/bounding/ZMod congruence over Z/Nat)
  # must not get for free. The prose scanner already flags the matching phrases (fractional ideal /
  # number field / ...); these give Layer-4 the matching CONTENT decls so it does not wave them through.
  #
  #   FractionalIdeal  — class-group/Dedekind object: '(I : FractionalIdeal (nonZeroDivisors Z) Q)'.
  #   Localization     — pass-to-fractions: 'Localization (nonZeroDivisors Z)' (built on OreLocalization).
  #   FractionRing     — the field of fractions object 'FractionRing Z' (= Localization at nonZeroDivisors).
  #   IsFractionRing   — the pass-to-fractions TYPECLASS ('IsFractionRing Z Q'). Distinct token: a bare
  #                      IsFractionRing instance does NOT always force `Localization` into the closure
  #                      (probed: 'IsFractionRing Int Rat' closure has IsFractionRing but NOT Localization).
  #   NumberField      — bare '[NumberField K]' closure constant (the existing dotted
  #                      Mathlib.NumberTheory.NumberField / NumberField.RingOfIntegers entries never
  #                      matched the bare `NumberField` typeclass used as '[Field K][NumberField K]').
  #
  # OVER-REJECTION SAFETY (the dominating constraint): the elementary reach depends on ZMod casework via
  # the integer<->ZMod bridge (ZMod.intCast_zmod_eq_zero_iff_dvd + decide). I LIVE-audited the actual
  # certified-proof shapes with these tokens patched in and confirmed they STILL PASS — crucially, the
  # ZMod/intCast bridge does NOT transitively touch ANY token below (the certified 3|a^2+b^2, ∀x:ZMod 5
  # x^5=x, ZMod 7/intCast-mod-4 closures are all CLEAN of Ideal.Quotient/HasQuotient/Ideal.span/
  # Localization/FractionRing/IsFractionRing/FractionalIdeal/NumberField). Receipt: research/docs/audits/.
  - FractionalIdeal
  - Localization
  - FractionRing
  - IsFractionRing
  - NumberField
  # Quotient-by-an-ideal family. Three live gaps share it: 'Ideal.Quotient.mk (Ideal.span {(5:Z)}) 12';
  # 'Q[X] ⧸ Ideal.span {X^2+1}' (re-opens AdjoinRoot via the un-named quotient path); and
  # 'IsDomain (R ⧸ P)' for a prime P (Ideal.Quotient.isDomain). The three gaps split across these tokens
  # (1a hits all three; the Q[X] quotient hits HasQuotient+Ideal.span but NOT Ideal.Quotient; the
  # quotient-is-a-domain hits Ideal.Quotient+HasQuotient but NOT Ideal.span), so all three are needed.
  # SAFE TO ADD BROADLY: probed live, the certified ZMod/intCast proofs do NOT touch Ideal.Quotient,
  # Ideal.span, or HasQuotient (Mathlib does NOT build ZMod or the cast bridge over an Ideal quotient in
  # these closures) — so these do NOT over-reject the certified elementary battery. `Ideal.Quotient` and
  # `Ideal.span` are dotted (scoped to those constructs); `HasQuotient` is the bare `⧸` typeclass.
  - Ideal.Quotient
  - HasQuotient
  - Ideal.span
  # ANALYSIS / TRIGONOMETRY (live-audited 2026-07-03, CEGAR-style refinement from a real counterexample).
  # v1's stipulated fragment T is INTEGER ELEMENTARY NUMBER THEORY. Real-analytic / trigonometric machinery
  # (Real.cos/sin/pi, exp/log, the inverse trig functions) is OUT-OF-DOMAIN for T — a proof whose proof-term
  # closure reaches into real analysis is not an integer-elementary proof, even if it compiles and is
  # sorry-free. DISCOVERED VIA THE `imo_1963_p5` NEGATIVE CONTROL: the trig identity
  # cos(pi/7)-cos(2pi/7)+cos(3pi/7)=1/2 was FALSELY certified `authoritative_elementary` under
  # profiles/authoritative.yaml because the denylist banned heavy algebraic-NT machinery but had ZERO
  # real-analysis/trig coverage — `Real.cos`/`Real.sin`/`Real.pi` in the closure matched nothing and were
  # waved through. The certificate semantics ("footprint within the stipulated fragment T") held; T's
  # BOUNDARY was simply wrong for v1. This section fixes the boundary from the live counterexample.
  #
  # DELIBERATE BOUNDARY — `Complex.exp` is NOT banned. The roots-of-unity filter (summing Σ_{n≡r} over ζ)
  # is an ALLOWED technique (agent/PLAN.md §2.1: "Finite, mechanical, no analysis") and it goes through
  # `Complex.exp` (ζ = exp(2πi/n)). Banning `Complex.exp` would break that allowed elementary tool. So we
  # ban the trig functions (`Real.cos`/`Real.sin`/`Complex.cos`/`Complex.sin`, ...) and the analytic
  # transcendentals (`Real.exp`/`Real.log`) but LEAVE `Complex.exp` allowed — an explicit tension held
  # open on purpose. (`Real.cos`/`Complex.cos` etc. are dotted, so they scope to exactly those decls and
  # do NOT touch `Complex.exp`.)
  #
  # `Real.sqrt` is DELIBERATELY NOT banned. The shipped √2 / √3 irrationality certifications
  # (research/docs/live_certification_runs.md: T3, and the √3 reach-map row) state the theorem over the
  # INTEGERS as `¬∃ x,y>0. x²=2y²` (infinite descent) — their proof-term closures are Int/Nat-only with
  # axioms ⊆ {propext, Classical.choice, Quot.sound}, and contain NO `Real.sqrt` (there is no `Real.sqrt`
  # anywhere in the repo). Elementary irrationality proofs legitimately use the `x²=D·y²` formulation, so
  # banning `Real.sqrt` would risk collateral-rejecting a legitimate elementary technique for no live gain.
  # Left alone.
  - Real.cos
  - Real.sin
  - Real.tan
  - Real.pi
  - Real.arccos
  - Real.arcsin
  - Real.arctan
  - Real.exp
  - Real.log
  - Complex.cos
  - Complex.sin
  - Mathlib.Analysis.SpecialFunctions.Trigonometric

lean_infrastructure_allowlist:
  - WellFounded.fix
  - WellFounded.recAux
  - Acc.rec
  - Nat.rec
  - Nat.strongRecOn
  - Decidable
  - DecidableEq
  - DecidablePred
  - SizeOf
  - instHAdd
  - instHMul

# Heavy-IMPLEMENTATION-but-elementary-RESULT APIs: their *internal* dependency closure is exempt from
# the content denylist (re-proving them elementarily is too costly for v1). Keep this list small and
# explicit; it documents the trust boundary (PLAN.md Section 5, Layer 4, item B3).
lean_elementary_by_fiat:
  - Nat.gcd
  - Nat.Coprime
  - Int.gcd
  - Nat.Prime
  - Nat.factorization
  - legendreSym
  - jacobiSym
  - ZMod.legendreSym
  - Nat.ModEq
  - Int.ModEq

# The ONLY axioms a sorry-free elementary proof may transitively use. Anything else (notably sorryAx)
# is a hard reject (PLAN.md Section 5, Layer 4, item 2; kernel `collectAxioms`).
lean_axiom_whitelist:
  - propext
  - Classical.choice
  - Quot.sound

# native_decide / compiler-trust per-computation axioms: they expand the TCB beyond the kernel and are
# banned regardless of the whitelist. `native_decide` (Lean 4.29+) emits `Lean.ofReduceBool` per
# computation, trusting the compiler+`Nat`/`Bool` `@[extern]` implementations rather than the kernel.
# These are checked BEFORE the whitelist as a named, intent-carrying ban (rejection code
# `axiom_denylisted`); the whitelist stays as the backstop.
lean_axiom_denylist:
  - Lean.ofReduceBool
  - ofReduceBool
  - Lean.reduceBool
  - Lean.reduceNat
  - Lean.trustCompiler
