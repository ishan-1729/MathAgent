# AUTHORITATIVE profile: the only configuration that can mint a real certificate.
#
# elementarity=authoritative wires the terminal Layer-4 gate (formalize -> Lean audit -> faithfulness)
# AND, with lean.per_node, Lean-verifies every leaf + AND-composition per node so LEAN_VERIFIED is
# reachable. Requires a reachable Lean REPL (`lake build repl`) and a resolvable formalizer — the
# supervisor (S1/S2) fails CLOSED before any model/Lean call if either is missing. DAG mode only
# (mode=direct + authoritative is rejected by S5).
name: authoritative
notes: "authoritative: terminal Layer-4 gate + per-node Lean. Needs a built Lean REPL."
mode: dag
elementarity: authoritative
stages:
  decompose: true
  review: true
  population: 0
  evolve_fallback: 0
  refine: false
  h0_consistency: true
roles:
  # Pin the formalizer to Opus: live-run evidence shows the Opus ClaudeFormalizer is what cleared the
  # autoformalization reach map for the terminal Layer-4 gate (the other roles keep their profile
  # defaults: provider=claude, per-role default model).
  formalizer:
    provider: claude
    model: opus
budgets:
  max_llm_calls: 60
  max_depth: 3
  max_decomp_attempts: 2
  episodes: 3
lean:
  per_node: true
  terminal: true
  strict: false
  server: true
