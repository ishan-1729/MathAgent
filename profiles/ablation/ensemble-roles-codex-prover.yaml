# ABLATION: MIXED-PROVIDER via the ROLE SPLIT (not the OpenEvolve ensemble) — prover routed to Codex/GPT.
#
# The OpenEvolve breadth/depth ensemble is CLAUDE-CLI-ONLY (its picklable _ClaudeLLMFactory shells the
# `claude` CLI), so a gpt-5.5 breadth/depth ensemble model name is not wired (see profiles/ablation/README.md).
# Mixed-provider comparison therefore runs at ROLE level instead: default base, prover -> Codex (gpt-5.5,
# effort medium); the other roles keep their Claude defaults. Supervisor S6 requires the Codex CLI on PATH.
# Evidence: the AlphaProof-style heterogeneous-prover comparison (does a different-provider prover change
# reach?) applied to the role the deterministic gate scores directly.
name: ablation-ensemble-roles-codex-prover
notes: "Ablation: mixed-provider role split — prover=Codex/gpt-5.5; other roles Claude defaults."
mode: dag
elementarity: soft
stages:
  decompose: true
  review: true
  population: 0
  evolve_fallback: 0
  refine: false
  h0_consistency: true
roles:
  prover:
    provider: codex
    model: gpt-5.5
    effort: medium
budgets:
  max_llm_calls: 60
  max_depth: 3
  max_decomp_attempts: 2
  episodes: 3
lean:
  per_node: false
  terminal: false
  strict: false
  server: false
