[project]
name = "mathagent"
version = "0.1.0"
description = "Agentic discovery of elementary number-theory proofs: the constraint engine and harness."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "sympy>=1.12",
    "jsonschema>=4.0",
    "pydantic>=2",
]

[project.scripts]
mathagent-prove = "scripts.prove:main"

[project.optional-dependencies]
# The wheel smoke test builds and installs the distribution without network/build isolation, so its
# packaging frontend/backend are explicit test dependencies (uv-created environments omit pip by default).
test = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "pip>=24.0",
    "setuptools>=68",
    "wheel>=0.43",
]
# Neural retrieval backend (bi-encoder + optional cross-encoder reranker). CPU-friendly.
neural = ["sentence-transformers>=2.2", "numpy>=1.24"]
# ArXivMath benchmark loader (HuggingFace datasets).
benchmark = ["datasets>=2.14"]
# Evolutionary proof-sketch search backend (MAP-Elites over ledgers; gate is the fitness oracle).
evolve = ["openevolve>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "agent",
    "agent.gates",
    "agent.tools",
    "agent.orchestrator",
    "agent.benchmarks",
    "profiles",
    # Regular package backing the installed ``mathagent-prove`` console entry point.
    "scripts",
    # Namespace package preserving the path expected by the installed Lean bridge.
    "formal.lean.mathagent_formal",
]

[tool.setuptools.package-data]
"agent" = ["roles/*.md"]
"agent.gates" = ["*.yaml", "*.json", "examples/*.json", "lean/*.lean"]
"profiles" = ["*.yaml", "ablation/*.yaml"]
"formal.lean.mathagent_formal" = [
    "lakefile.toml",
    "lake-manifest.json",
    "lean-toolchain",
    "MathagentFormal.lean",
    "MathagentFormal/*.lean",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
