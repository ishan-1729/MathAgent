[project]
name = "mathagent"
version = "0.1.0"
description = "Agentic discovery of elementary number-theory proofs: the constraint engine and harness."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "sympy>=1.12",
    "jsonschema>=4.0",
    "pydantic>=2",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "hypothesis>=6.0"]
# Neural retrieval backend (bi-encoder + optional cross-encoder reranker). CPU-friendly.
neural = ["sentence-transformers>=2.2", "numpy>=1.24"]
# ArXivMath benchmark loader (HuggingFace datasets).
benchmark = ["datasets>=2.14"]
# Evolutionary proof-sketch search backend (MAP-Elites over ledgers; gate is the fitness oracle).
evolve = ["openevolve>=0.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "agent",
    "agent.gates",
    "agent.tools",
    "agent.orchestrator",
    "agent.benchmarks",
]

[tool.setuptools.package-data]
"agent.gates" = ["*.yaml", "*.json", "examples/*.json"]

# Ship the RunProfile presets (profiles/ + profiles/ablation/) so an installed copy carries the
# default/codex/solution-only/authoritative presets and the per-stage ablation profiles. They live at
# the repo root (alongside scripts/), so they are registered as data-files rather than package-data.
[tool.setuptools.data-files]
"share/mathagent/profiles" = [
    "profiles/default.yaml",
    "profiles/codex.yaml",
    "profiles/solution-only.yaml",
    "profiles/authoritative.yaml",
]
"share/mathagent/profiles/ablation" = [
    "profiles/ablation/no-decompose.yaml",
    "profiles/ablation/no-review.yaml",
    "profiles/ablation/no-h0.yaml",
    "profiles/ablation/no-refine.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mathagent]
status = "phase-1"
