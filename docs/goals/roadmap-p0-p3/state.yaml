  slug: "roadmap-p0-p3"
  kind: existing_plan
  tranche: "Land P0+P1 (both roadmaps), then P2, then P3 — verifying each slice — then an adversarial audit; continue until all three oracle conditions hold."
  status: done   # P0-P3 built + 6 remediation rounds; oracle 1+2 hold; oracle-3 residual is the ACCEPTED trivial-cover spoof (search-signal only, never a false certificate, Layer-4-bounded, documented + pinned)
  oracle:
    signal: "full offline pytest green (baseline 398 passed / 8 skipped) + new deterministic invariant tests pass + an adversarial re-attack (Codex refuter + Opus skeptics) finds no soundness/reward-hacking hole"
    cadence: "after each Worker package and at final audit"
    final_proof: "receipts showing: suite green; FSM totality + NEEDS_REVIEW->decompose + terminal-absorbing + stale-context-miss + reward-hacking-trap + fitness-zeroing tests pass; adversarial audit reports no exploitable path"
  intake:
    original_request: "Build the intended structures in the live reports completely (ALL P0/P1/...) with slash goal loops + multiple Opus 4.8 workers; verify adversarially."
    interpreted_outcome: "Implement every prioritized structure from forge_relevance_study.md §7 and openevolve_stacking_brief.md §9, keep the suite green, and prove it survives adversarial re-attack."
    input_shape: existing_plan
    audience: "the MathAgent maintainer (the user)"
    authority: approved
    proof_type: test
    completion_proof: "all three oracle conditions hold with receipts"
    likely_misfire: "adding P2/P3 parallelism/diversity on top of a still-gameable fitness or still-broken give-up path; refactoring without the proptests that prove the invariants"
    blind_spots_considered:
      - "T100 (orchestrator) and T101 (OpenEvolve fitness) must edit DISJOINT files to run in parallel"
      - "changes to the gate/ledger could affect openevolve_bridge.score_ledger -> keep evaluate() semantics unchanged; final full-suite is authoritative"
      - "the FSM refactor must be behavior-preserving except the one deliberate NEEDS_REVIEW->decompose fix"
    existing_plan_facts:
      - "P0 (forge): suspending fix at agent/orchestrator/dag_driver.py:229-231"
      - "P1 (forge): total node_transition table + reason codes + split-keyed memo (semantic_goal_hash + proof_context_hash) + adversarial verifier + downgrade-don't-discard"
      - "P0 (openevolve): hard fitness-zeroing goal-binding+vacuity gate at archive insertion in openevolve_bridge.score_ledger; NEEDS_REVIEW(0.5) is not a win"
      - "P1 (openevolve): numeric-grounding evolution mode (exact-integer checker; NO eval) + vector fitness + obligation-debt"
      - "P2: Dilworth width + upward_rank + H0 child-consistency + event-driven AND scheduling"
      - "P3: rank-aware model routing; next_producers = fan-in x critical-path; Elo/BT/PUCT over hard-filtered elites; AutoReason one-way; OpenEvolve fallback decomposer + strategy MAP-Elites + retrieval islands"
      - "8 forge regression tests + reward-hacking trap test"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 2   # user EXPLICITLY asked for parallel Opus workers; T100/T101 have proven-disjoint scopes
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: none   # execution is driven by parallel Opus Workflow workers; board is the durable PM record
  local:
    status: not_requested
    url: null
    command: "npx goalbuddy board docs/goals/roadmap-p0-p3"

active_task: null   # roadmap built + audited; V6 residual accepted-by-decision (search-only, Layer-4-bounded); pending commit

